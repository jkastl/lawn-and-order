name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan files and every commit
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: python3 scripts/check_pii.py --all --commits HEAD
      - run: python3 budget/build_budget.py --check

  deploy:
    name: Publish site/ to GitHub Pages
    needs: privacy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the site/ folder is published, never the rest of the repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
