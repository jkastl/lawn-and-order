name: Release

# When VERSION changes on main, tag vX.Y.Z and publish a GitHub release
# using that version's section of CHANGELOG.md. Re-runs are harmless:
# an existing tag is left alone.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        run: python3 scripts/check_version.py
      - name: Tag and release if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged; nothing to do."
            exit 0
          fi
          python3 scripts/check_version.py --notes > "$RUNNER_TEMP/notes.md"
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file "$RUNNER_TEMP/notes.md"
